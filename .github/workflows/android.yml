
name: Build Mo.F Sales Assistant APK

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"
          test -n "$ZIP_FILE"
          mkdir -p /tmp/mof-project
          unzip -oq "$ZIP_FILE" -d /tmp/mof-project
          PROJECT_DIR="$(find /tmp/mof-project -type f -name settings.gradle -printf '%h\n' | head -n 1)"
          test -n "$PROJECT_DIR"
          cp -a "$PROJECT_DIR"/. .
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml

      - name: Show SHA-1
        run: gradle --no-daemon signingReport

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MoF-Sales-Assistant-APK
          path: app/build/outputs/apk/debug/*.apk
