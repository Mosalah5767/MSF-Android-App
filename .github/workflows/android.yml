
name: Build MSF Sales Assistant APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'MSF-Android-Project.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          test -f MSF-Android-Project.zip
          mkdir -p /tmp/msf-project
          unzip -o MSF-Android-Project.zip -d /tmp/msf-project
          cp -a /tmp/msf-project/msf-android-project/. .
          test -f app/src/main/assets/index.html
          test -f app/src/main/java/com/msf/sales/MainActivity.java

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle assembleDebug

      - name: Check APK
        run: |
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          file app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk
          unzip -l app/build/outputs/apk/debug/app-debug.apk | head -30

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MSF-Sales-Assistant-APK
          path: app/build/outputs/apk/debug/app-debug.apk
