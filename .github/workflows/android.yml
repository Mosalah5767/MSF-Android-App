
name: Build Mo.F Sales Assistant APK

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/android.yml'
      - 'google-services.json'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="./MoF-Android-Project-Google-Sync.zip"
          test -n "$ZIP_FILE"
          mkdir -p /tmp/mof-project
          unzip -oq "$ZIP_FILE" -d /tmp/mof-project
          PROJECT_DIR="$(find /tmp/mof-project -type f -name settings.gradle -printf '%h\n' | head -n 1)"
          test -n "$PROJECT_DIR"
          cp -a "$PROJECT_DIR"/. .
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/assets/index.html
          test -f google-services.json
          mkdir -p app
          cp -f google-services.json app/google-services.json
          python3 - <<'PY'
          import json
          with open("app/google-services.json", encoding="utf-8") as f:
              data = json.load(f)
          clients = data.get("client", [])
          assert any(
              c.get("client_info", {}).get("android_client_info", {}).get("package_name") == "com.msf.sales"
              and any(o.get("client_type") == 1 and o.get("android_info", {}).get("certificate_hash", "").lower() == "28b29ef6d36a6e193128f69c7568884d3035a33d" for o in c.get("oauth_client", []))
              and any(o.get("client_type") == 3 for o in c.get("oauth_client", []))
              for c in clients
          ), "Firebase OAuth clients or signing certificate do not match this APK"
          print("Firebase config verified for com.msf.sales and the stable signing certificate.")
          PY
          printf 'android.useAndroidX=true\nandroid.enableJetifier=true\n' > gradle.properties

      - name: Fix reliable product saving and Google account feedback
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          java = Path("app/src/main/java/com/msf/sales/MainActivity.java")
          html = Path("app/src/main/assets/index.html")
          j = java.read_text(encoding="utf-8")
          h = html.read_text(encoding="utf-8")

          def replace_once(source, old, new, label):
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one {label}, found {count}")
              return source.replace(old, new, 1)

          # Remove the obsolete viewer script: its missing viewerImage element threw
          # before the product form and authentication handlers could be registered.
          viewer_start = "let viewerScale=1,viewerX=0,viewerY=0,viewerPointers=new Map()"
          viewer_end = "function esc(s)"
          start = h.find(viewer_start)
          end = h.find(viewer_end, start + 1) if start >= 0 else -1
          if start < 0 or end < 0:
              raise SystemExit("Cannot locate obsolete photo viewer block safely")
          h = h[:start] + h[end:]

          j = replace_once(j, "import android.content.Intent;", "import android.content.Intent;\nimport android.content.SharedPreferences;", "Intent import")
          if "import com.google.android.gms.common.api.ApiException;" not in j:
              j = j.replace("import com.google.android.gms.auth.api.signin.GoogleSignInOptions;", "import com.google.android.gms.auth.api.signin.GoogleSignInOptions;\nimport com.google.android.gms.common.api.ApiException;")
          j = replace_once(j, "    private FirebaseFirestore db;", "    private FirebaseFirestore db;\n    private SharedPreferences localPrefs;", "Firebase fields")
          j = replace_once(j, "        auth = FirebaseAuth.getInstance(); db = FirebaseFirestore.getInstance();", "        auth = FirebaseAuth.getInstance(); db = FirebaseFirestore.getInstance();\n        localPrefs = getSharedPreferences(\"mof_local_data\", MODE_PRIVATE);", "Firebase initialization")
          j = replace_once(j, "        webView.setWebViewClient(new WebViewClient());", """        webView.setWebViewClient(new WebViewClient() {
                      @Override public void onPageFinished(WebView view, String url) {
                          super.onPageFinished(view, url);
                          if (auth.getCurrentUser() != null && auth.getCurrentUser().getEmail() != null) {
                              message("mofAuthResult", "الحساب المرتبط: " + auth.getCurrentUser().getEmail());
                          }
                      }
                  });""", "WebViewClient")
          j = replace_once(j, "    private class AppBridge {\n", """    private class AppBridge {
                  @JavascriptInterface public boolean saveLocal(String json) {
                      if (json == null || json.length() > 8_000_000) return false;
                      return localPrefs.edit().putString("products_json", json).commit();
                  }
                  @JavascriptInterface public String loadLocal() {
                      return localPrefs.getString("products_json", "");
                  }
          """, "AppBridge start")
          old_result = """        if(requestCode==GOOGLE_SIGN_IN){try{String token=GoogleSignIn.getSignedInAccountFromIntent(data).getResult(ApiException.class).getIdToken();auth.signInWithCredential(GoogleAuthProvider.getCredential(token,null)).addOnSuccessListener(a->{message("mofAuthResult","تم تسجيل الدخول: "+a.getUser().getEmail());new AppBridge().restore();}).addOnFailureListener(e->message("mofAuthResult","فشل تسجيل الدخول: "+e.getMessage()));}catch(Exception e){message("mofAuthResult","لم يكتمل تسجيل الدخول: "+e.getMessage());}}"""
          new_result = """        if (requestCode == GOOGLE_SIGN_IN) {
                      if (resultCode != RESULT_OK || data == null) {
                          message("mofAuthResult", "لم يكتمل اختيار حساب Google. حاول مرة أخرى.");
                          return;
                      }
                      try {
                          String token = GoogleSignIn.getSignedInAccountFromIntent(data).getResult(ApiException.class).getIdToken();
                          if (token == null || token.isEmpty()) {
                              message("mofAuthResult", "لم يصل رمز التحقق من Google. تحقق من إعداد OAuth.");
                              return;
                          }
                          auth.signInWithCredential(GoogleAuthProvider.getCredential(token, null))
                              .addOnSuccessListener(a -> {
                                  String email = a.getUser() != null ? a.getUser().getEmail() : "";
                                  message("mofAuthResult", "تم ربط حساب Google بنجاح: " + email);
                                  new AppBridge().restore();
                              })
                              .addOnFailureListener(e -> message("mofAuthResult", "فشل ربط حساب Google: " + e.getMessage()));
                      } catch (ApiException e) {
                          message("mofAuthResult", "تعذر إكمال تسجيل Google (رمز " + e.getStatusCode() + "): " + e.getMessage());
                      } catch (Exception e) {
                          message("mofAuthResult", "تعذر إكمال تسجيل Google: " + e.getMessage());
                      }
                  }"""
          j = replace_once(j, old_result, new_result, "Google sign-in result handler")

          old_load = "function load(){try{products=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(products))products=[]}catch(e){products=[];document.getElementById('storageStatus').textContent='تعذر قراءة التخزين المحلي؛ صدّر نسخة احتياطية إذا كانت متاحة.'}renderProducts()}"
          new_load = """function load(){try{let raw='';if(window.MoFAndroid&&window.MoFAndroid.loadLocal)raw=window.MoFAndroid.loadLocal()||'';if(!raw)raw=localStorage.getItem(KEY)||'[]';products=JSON.parse(raw);if(!Array.isArray(products))products=[];if(window.MoFAndroid&&window.MoFAndroid.saveLocal&&products.length)window.MoFAndroid.saveLocal(JSON.stringify(products))}catch(e){try{products=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(products))products=[]}catch(x){products=[];document.getElementById('storageStatus').textContent='تعذر قراءة التخزين؛ لم يتم حذف البيانات.'}}renderProducts()}"""
          h = replace_once(h, old_load, new_load, "product load function")
          old_persist = "function persist(){try{localStorage.setItem(KEY,JSON.stringify(products));if(window.MoFAndroid&&window.MoFAndroid.account())window.MoFAndroid.sync(JSON.stringify(products));return true}catch(e){toast('تعذر الحفظ: مساحة التخزين قد تكون ممتلئة. قلّل حجم الصور وصدّر نسخة احتياطية.');return false}}"
          new_persist = """function persist(){let json;try{json=JSON.stringify(products)}catch(e){toast('تعذر تجهيز بيانات المنتج للحفظ');return false}let nativeSaved=false;try{if(window.MoFAndroid&&window.MoFAndroid.saveLocal)nativeSaved=window.MoFAndroid.saveLocal(json)===true}catch(e){}let browserSaved=false;try{localStorage.setItem(KEY,json);browserSaved=true}catch(e){}if(!nativeSaved&&!browserSaved){toast('تعذر الحفظ في مساحة الجهاز. حرّر مساحة ثم حاول مجدداً.');return false}try{if(window.MoFAndroid&&window.MoFAndroid.account())window.MoFAndroid.sync(json)}catch(e){}return true}"""
          h = replace_once(h, old_persist, new_persist, "product persist function")
          old_login = "function googleLogin(){if(!window.MoFAndroid){toast('ميزة Google تعمل داخل تطبيق Android فقط');return;}window.MoFAndroid.signIn();}"
          new_login = """function googleLogin(){try{toast('جاري فتح نافذة اختيار حساب Google...');if(!window.MoFAndroid||typeof window.MoFAndroid.signIn!=='function'){toast('تعذر الوصول إلى خدمة Google داخل التطبيق.');return;}window.MoFAndroid.signIn();}catch(e){toast('تعذر بدء ربط Google: '+(e&&e.message?e.message:e));}}"""
          h = replace_once(h, old_login, new_login, "Google login button handler")
          old_auth = "window.mofAuthResult=function(msg){document.getElementById('googleStatus').textContent=msg;toast(msg);};"
          new_auth = """window.mofAuthResult=function(msg){let s=document.getElementById('googleStatus');if(s)s.textContent=msg;let b=document.querySelector('[onclick="googleLogin()"]');if(b){if(msg.includes('تم ربط حساب Google')||msg.includes('الحساب المرتبط:')){b.textContent='تم الربط ✓';b.classList.add('gold')}else if(msg.includes('فشل')||msg.includes('تعذر')||msg.includes('لم يكتمل')){b.textContent='إعادة المحاولة';}}toast(msg);};"""
          h = replace_once(h, old_auth, new_auth, "Google status callback")

          zoom_css = """
          .mof-zoom-overlay{position:fixed;inset:0;background:rgba(0,0,0,.96);z-index:9999;display:none;align-items:center;justify-content:center;padding:18px;touch-action:none}
          .mof-zoom-overlay.open{display:flex}
          .mof-zoom-image{max-width:100%;max-height:82vh;object-fit:contain;transform:scale(1);transform-origin:center;touch-action:none;user-select:none;-webkit-user-drag:none}
          .mof-zoom-tools{position:absolute;left:0;right:0;bottom:calc(18px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:12px;z-index:2}
          .mof-zoom-tools button,.mof-zoom-close{border:1px solid #b99a54;background:#17140e;color:#f0d18a;border-radius:12px;min-width:46px;height:44px;font-size:22px;font-weight:800}
          .mof-zoom-close{position:absolute;top:calc(18px + env(safe-area-inset-top));right:18px}
          .photo-gallery img,.photo-preview img{cursor:zoom-in}
          """
          if "</style>" not in h:
              raise SystemExit("Cannot find HTML style closing tag for image zoom")
          h = h.replace("</style>", zoom_css + "\\n</style>", 1)

          zoom_js = """
          (function(){
            let overlay, picture, scale=1, startDistance=0, startScale=1;
            function setScale(v){scale=Math.max(1,Math.min(5,v));if(picture)picture.style.transform='scale('+scale+')';}
            function close(){if(overlay){overlay.classList.remove('open');overlay.setAttribute('aria-hidden','true');}setScale(1);}
            function ensure(){
              if(overlay)return;
              overlay=document.createElement('div');overlay.className='mof-zoom-overlay';overlay.setAttribute('aria-hidden','true');
              overlay.innerHTML='<button type="button" class="mof-zoom-close" aria-label="إغلاق">×</button><img class="mof-zoom-image" alt="صورة مكبرة"><div class="mof-zoom-tools"><button type="button" data-zoom="out" aria-label="تصغير">−</button><button type="button" data-zoom="reset" aria-label="الحجم الطبيعي">↺</button><button type="button" data-zoom="in" aria-label="تكبير">＋</button></div>';
              document.body.appendChild(overlay);picture=overlay.querySelector('img');
              overlay.querySelector('.mof-zoom-close').addEventListener('click',close);
              overlay.addEventListener('click',e=>{if(e.target===overlay)close();});
              overlay.querySelectorAll('[data-zoom]').forEach(b=>b.addEventListener('click',()=>{let a=b.dataset.zoom;setScale(a==='in'?scale+.35:a==='out'?scale-.35:1);}));
              overlay.addEventListener('wheel',e=>{e.preventDefault();setScale(scale+(e.deltaY<0?.2:-.2));},{passive:false});
              picture.addEventListener('touchstart',e=>{if(e.touches.length===2){startDistance=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);startScale=scale;}},{passive:true});
              picture.addEventListener('touchmove',e=>{if(e.touches.length===2&&startDistance){e.preventDefault();let d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);setScale(startScale*d/startDistance);}},{passive:false});
              picture.addEventListener('touchend',()=>{startDistance=0;},{passive:true});
              document.addEventListener('keydown',e=>{if(e.key==='Escape')close();});
            }
            document.addEventListener('click',e=>{
              const img=e.target.closest('.photo-gallery img,.photo-preview img');
              if(!img||!img.src||img.style.display==='none')return;
              ensure();picture.src=img.src;picture.alt=img.alt||'صورة المنتج';setScale(1);
              overlay.classList.add('open');overlay.setAttribute('aria-hidden','false');
            });
          })();
          """
          if "</script>" not in h:
              raise SystemExit("Cannot find HTML script closing tag for image zoom")
          pos = h.rfind("</script>")
          h = h[:pos] + zoom_js + "\\n" + h[pos:]
          java.write_text(j, encoding="utf-8")

          html.write_text(h, encoding="utf-8")
          print("Applied native persistent storage fallback and visible Google sign-in status.")
          PY
      - name: Inspect both project archives
        shell: bash
        run: |
          set -euo pipefail
          for z in MoF-Android-Project-Google-Sync.zip MoF-Storage-Fix-Ready-Updated.zip; do
            d="/tmp/inspect-$RANDOM"
            mkdir -p "$d"
            unzip -oq "$z" -d "$d"
            echo "===== ARCHIVE $z ====="
            find "$d" -type f | sort
            echo "===== BUILD FILES ====="
            find "$d" -name build.gradle -o -name settings.gradle | while read f; do echo "--- $f"; cat "$f"; done
            echo "===== HTML AUTH/SYNC HOOKS ====="
            grep -nEi 'mofAuthResult|mofSyncResult|mofCloudData|MoFAndroid|signIn|sync|restore|localStorage|products|saveData' "$d/app/src/main/assets/index.html" | head -n 120 || true
            echo "===== FIREBASE README ====="
            cat "$d/README-FIREBASE-AR.txt" 2>/dev/null || true
            echo "===== GOOGLE CONFIG SUMMARY ====="
            echo "===== FIREBASE / AUTH CODE ====="
            grep -RniE 'FirebaseAuth|FirebaseFirestore|FirebaseDatabase|GoogleSignIn|google-services|firebase' "$d" --exclude='*.png' || true
            echo "===== MAIN ACTIVITY ====="
            find "$d" -name MainActivity.java | while read f; do cat "$f"; done
          done

      - name: Verify patched app handlers
        shell: bash
        run: |
          echo "===== FULL APP SCRIPT ====="
          nl -ba app/src/main/assets/index.html | sed -n '34,75p'
          echo "===== NATIVE GOOGLE AUTH ====="
          grep -nEi 'signIn\(|onActivityResult|GOOGLE_SIGN_IN|default_web_client_id' app/src/main/java/com/msf/sales/MainActivity.java

      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.config/.android/debug.keystore
          key: mof-debug-signing-key-v1

      - name: Create debug signing key
        run: |
          mkdir -p "$HOME/.config/.android"
          if [ ! -f "$HOME/.config/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
            -keystore "$HOME/.config/.android/debug.keystore" \
            -storepass android \
            -alias AndroidDebugKey \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000
          fi

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Show SHA-1
        run: gradle --no-daemon signingReport

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MoF-Sales-Assistant-APK
          path: app/build/outputs/apk/debug/*.apk
