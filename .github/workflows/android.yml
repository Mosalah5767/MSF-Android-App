
name: Build Mo.F Sales Assistant APK

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find and extract Android project
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"
          test -n "$ZIP_FILE"
          mkdir -p /tmp/mof-project
          unzip -oq "$ZIP_FILE" -d /tmp/mof-project

          PROJECT_DIR="$(find /tmp/mof-project -type f -name settings.gradle -printf '%h\n' | head -n 1)"
          test -n "$PROJECT_DIR"

          cp -a "$PROJECT_DIR"/. .
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/assets/index.html
          test -f app/src/main/java/com/msf/sales/MainActivity.java

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Verify APK
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"
          unzip -t "$APK"
          if command -v apkanalyzer >/dev/null 2>&1; then
            apkanalyzer apk summary "$APK"
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MoF-Sales-Assistant-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
